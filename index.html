    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Ignore WebSocket and HMR connection errors per AI Studio runtime constraints
      window.addEventListener('error', function (e) {
        if (
          e.message && (
            e.message.indexOf('WebSocket') !== -1 ||
            e.message.indexOf('createWebSocketModuleRunnerTransport') !== -1
          ) ||
          (e.filename && e.filename.indexOf('@vite/client') !== -1)
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason && (e.reason.message || e.reason.stack || String(e.reason));
        if (
          reason && (
            reason.indexOf('WebSocket') !== -1 ||
            reason.indexOf('createWebSocketModuleRunnerTransport') !== -1 ||
            reason.indexOf('@vite/client') !== -1
          )
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
    <title>Portfolio Hub - গ্রাফিক্স ডিজাইন পোর্টফোলিও শোকেস</title>
